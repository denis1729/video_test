<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para Ema ❤️</title>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  overflow:hidden;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  text-align:center;
}

/* Inicio */
.start{ color:white; }

.start h1{
  font-size:34px;
  margin-bottom:10px;
}

button{
  padding:12px 22px;
  font-size:16px;
  border:none;
  border-radius:8px;
  background:#ff6b81;
  color:white;
  cursor:pointer;
}

/* Escena */
.scene{ display:none; }

/* Sobre */
.envelope{
  position:relative;
  width:340px;
  height:220px;
  background:#fff;
  border-radius:10px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
  cursor:pointer;
  overflow:hidden;
  margin:auto;
}

.flap{
  position:absolute;
  width:100%;
  height:100%;
  background:#ff6b81;
  clip-path:polygon(0 0,100% 0,50% 55%);
  transition:0.8s;
  z-index:2;
}

.letter{
  position:absolute;
  width:90%;
  height:90%;
  background:white;
  top:5%;
  left:5%;
  padding:15px;
  box-sizing:border-box;
  transform:translateY(100%);
  transition:0.8s;
  overflow:auto;
  font-size:14px;
}

.envelope.open .flap{ transform:translateY(-100%); }
.envelope.open .letter{ transform:translateY(0); }

/* Foto */
.photo{
  width:100%;
  border-radius:10px;
  margin-bottom:10px;
}

/* Corazones */
.heart{
  position:absolute;
  bottom:-20px;
  animation:float 6s linear infinite;
}

@keyframes float{
  from{ transform:translateY(0); opacity:1;}
  to{ transform:translateY(-110vh); opacity:0;}
}
</style>
</head>

<body>

<!-- Inicio -->
<div class="start" id="start">
  <h1>Ema Román Ortuño ❤️</h1>
  <p>Preparé algo hermoso para ti…</p>
  <button onclick="begin()">Abrir mi sorpresa</button>
</div>

<!-- Carta -->
<div class="scene" id="scene">
  <div class="envelope" onclick="openLetter(this)">
    <div class="flap"></div>

    <div class="letter">

      <!-- FOTO -->
      <img src="foto.jpg" class="photo">

      <h3>Feliz 14 de febrero ❤️</h3>

      <p>
        A tu lado entendí lo que significa amar de verdad.
        Gracias por cada abrazo, cada palabra y cada momento
        que construimos juntos.
      </p>

      <p>
        Si volviera a empezar mi vida,
        te elegiría una y mil veces más.
      </p>

      <p><b>Siempre tú y yo.<br>Denis 💖</b></p>
    </div>
  </div>
</div>

<!-- Música -->
<audio id="music" loop>
  <source src="perfect.mp3" type="audio/mpeg">
</audio>

<script>
function begin(){
  document.getElementById("start").style.display="none";
  document.getElementById("scene").style.display="block";
  document.getElementById("music").play();
}

function openLetter(element){
  element.classList.toggle("open");

  for(let i=0;i<35;i++){
    let heart = document.createElement("div");
    heart.className="heart";
    heart.innerHTML="❤️";
    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(Math.random()*20+15)+"px";
    heart.style.animationDuration=(Math.random()*3+3)+"s";
    document.body.appendChild(heart);

    setTimeout(()=>heart.remove(),6000);
  }
}
</script>

</body>
</html>
