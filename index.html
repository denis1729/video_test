<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Denis ❤️ Ema</title>

  <style>
/* ======================================================
   RESET & BASE
====================================================== */
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  min-height:100vh;
  overflow:hidden;
  background:url("inicio.jpg") center/cover no-repeat fixed;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* ======================================================
   PANTALLA INICIAL
====================================================== */
.start{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  color:white;
  padding:20px;
  z-index:5;
}

.start h1{
  font-size:clamp(28px,8vw,60px);
  text-shadow:0 0 20px #ff4da6,0 0 40px #ff4da6;
}

.start button{
  margin-top:25px;
  padding:14px 30px;
  font-size:22px;
  border:none;
  border-radius:12px;
  background:#ff4da6;
  color:white;
  cursor:pointer;
}

/* ======================================================
   FORMACION
====================================================== */
.heart-formation{
  position:fixed;
  inset:0;
  background:black;
  display:none;
  z-index:6;
}
#heartCanvas{width:100%;height:100%;}

/* ======================================================
   ESCENA PRINCIPAL
====================================================== */
.scene{
  position:fixed;
  inset:0;
  display:none;
}

/* nombres */
.names{
  position:absolute;
  top:5%;
  width:100%;
  text-align:center;
  font-size:clamp(26px,7vw,60px);
  font-weight:bold;
  color:white;
  text-shadow:0 0 10px white,0 0 25px #ff4da6,0 0 50px #ff4da6;
  animation:pulse 1.5s infinite alternate;
  z-index:3;
}
@keyframes pulse{from{opacity:.7;}to{opacity:1;}}

/* ======================================================
   SLIDER
====================================================== */
.slider{
  position:absolute;
  top:20%;
  width:100%;
  height:40vh;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:2;
}

.slide{
  position:absolute;
  width:90%;
  max-width:420px;
  height:100%;
  object-fit:contain;
  border-radius:18px;
  opacity:0;
  transition:opacity 1s ease;
}
.slide.active{opacity:1;}

/* ======================================================
   CARTA
====================================================== */
.letter{
  position:absolute;
  bottom:5%;
  left:5%;
  width:90%;
  background:rgba(255,255,255,.95);
  padding:20px;
  border-radius:18px;
  text-align:center;
  display:none;
  z-index:3;
}

/* ======================================================
   CORAZONES FLOTANTES
====================================================== */
.heart{
  position:absolute;
  bottom:-20px;
  font-size:20px;
  animation:floatUp linear forwards;
  z-index:1;
}
@keyframes floatUp{
  to{transform:translateY(-110vh);opacity:0;}
}

/* ======================================================
   FUEGOS
====================================================== */
canvas.fire{
  position:absolute;
  inset:0;
  z-index:0;
}
</style>
</head>

<body>

<!-- ======================================================
     INICIO
====================================================== -->
<div class="start" id="start">
  <h1>Tengo algo para ti ❤️</h1>
  <button id="startBtn">Abrir sorpresa</button>
</div>

<!-- ======================================================
     FORMACION
====================================================== -->
<div class="heart-formation" id="heartFormation">
  <canvas id="heartCanvas"></canvas>
</div>

<!-- ======================================================
     ESCENA
====================================================== -->
<div class="scene" id="scene">

  <div class="names" id="names"></div>

  <div class="slider" id="slider">
    <img src="foto1.jpg" class="slide active">
    <img src="foto2.jpg" class="slide">
    <img src="foto3.jpg" class="slide">
    <img src="foto4.jpg" class="slide">
    <img src="foto5.jpg" class="slide">
    <img src="foto6.jpg" class="slide">
    <img src="foto7.jpg" class="slide">
    <img src="foto8.jpg" class="slide">
    <img src="foto9.jpg" class="slide">
    <img src="foto10.jpg" class="slide">
    <img src="foto11.jpg" class="slide">
    <img src="foto12.jpg" class="slide">
    <img src="foto13.jpg" class="slide">
  </div>

  <div class="letter" id="letter">
    <h2>Feliz 14 de febrero ❤️</h2>

    <p>
      A tu lado descubrí el verdadero significado del amor.
      Gracias por tu paciencia, tu fuerza y cada instante
      que construimos juntos.
    </p>

    <p>
      Eres mi hogar, mi paz y mi felicidad diaria.
      Si volviera a nacer, te elegiría siempre.
    </p>

    <p><b>Con todo mi corazón,<br>Denis 💖</b></p>
  </div>

  <canvas class="fire" id="fireworks"></canvas>

</div>

<audio id="music" loop>
  <source src="Thousand.mp3" type="audio/mpeg">
</audio>

<script>
/* ======================================================
   CONFIGURACIÓN (EDITAS SOLO AQUÍ)
====================================================== */
const CONFIG = {
  names: "Denis ❤️ Ema",
  heartColor: "#ff4da6",
  sliderInterval: 3000,
  showLetterAfter: 4000
};

/* ======================================================
   HELPERS
====================================================== */
const $ = id => document.getElementById(id);

/* ======================================================
   APP CONTROLLER
====================================================== */
const App = (()=>{

  function init(){
    $("names").textContent = CONFIG.names;
    $("startBtn").addEventListener("click", start);
  }

  function start(){
    $("start").style.display="none";
    $("heartFormation").style.display="block";

    HeartEngine.play(()=>{
      $("heartFormation").style.display="none";
      $("scene").style.display="block";
      $("music").play();

      Slider.start();
      FloatingHearts.start();
      Fireworks.start();

      setTimeout(()=> $("letter").style.display="block", CONFIG.showLetterAfter);
    });
  }

  return { init };
})();

/* ======================================================
   HEART ENGINE (neón + letras)
====================================================== */
const HeartEngine = (()=>{

  function play(done){
    const canvas=$("heartCanvas");
    const ctx=canvas.getContext("2d");

    resize();
    window.addEventListener("resize",resize);

    const cx=canvas.width/2;
    const cy=canvas.height/2;
    const size=Math.min(canvas.width,canvas.height)/40;

    const particles=[];

    for(let i=0;i<260;i++){
      const t=Math.PI*2*(i/260);
      const x=16*Math.pow(Math.sin(t),3);
      const y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));

      particles.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        tx:cx+x*size,
        ty:cy+y*size
      });
    }

    let frame=0;

    function animate(){
      ctx.fillStyle="rgba(0,0,0,.25)";
      ctx.fillRect(0,0,canvas.width,canvas.height);

      particles.forEach(p=>{
        p.x+=(p.tx-p.x)*.05;
        p.y+=(p.ty-p.y)*.05;

        ctx.beginPath();
        ctx.arc(p.x,p.y,2,0,Math.PI*2);
        ctx.shadowColor=CONFIG.heartColor;
        ctx.shadowBlur=12;
        ctx.fillStyle=CONFIG.heartColor;
        ctx.fill();
      });

      frame++;
      if(frame<220) requestAnimationFrame(animate);
      else setTimeout(done,1200);
    }

    animate();

    function resize(){
      canvas.width=window.innerWidth;
      canvas.height=window.innerHeight;
    }
  }

  return { play };
})();

/* ======================================================
   SLIDER ENGINE
====================================================== */
const Slider = (()=>{
  let i=0,slides;

  function start(){
    slides=document.querySelectorAll(".slide");
    setInterval(()=>{
      slides[i].classList.remove("active");
      i=(i+1)%slides.length;
      slides[i].classList.add("active");
    },CONFIG.sliderInterval);
  }

  return { start };
})();

/* ======================================================
   FLOATING HEARTS
====================================================== */
const FloatingHearts = (()=>{

  function start(){
    setInterval(()=>{
      const h=document.createElement("div");
      h.className="heart";
      h.style.left=Math.random()*100+"%";
      h.style.animationDuration=(Math.random()*3+3)+"s";
      h.innerHTML="❤️";
      document.body.appendChild(h);
      setTimeout(()=>h.remove(),6000);
    },300);
  }

  return { start };
})();

/* ======================================================
   FIREWORKS ENGINE
====================================================== */
const Fireworks = (()=>{

  const canvas=$("fireworks");
  const ctx=canvas.getContext("2d");
  let particles=[];

  function start(){
    resize();
    window.addEventListener("resize",resize);
    setInterval(create,900);
    animate();
  }

  function resize(){
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
  }

  function create(){
    const x=Math.random()*canvas.width;
    const y=Math.random()*canvas.height/2;

    for(let i=0;i<40;i++){
      particles.push({
        x,y,
        angle:Math.random()*2*Math.PI,
        speed:Math.random()*5+2,
        life:100
      });
    }
  }

  function animate(){
    ctx.fillStyle="rgba(0,0,0,.2)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    particles.forEach((p,index)=>{
      p.x+=Math.cos(p.angle)*p.speed;
      p.y+=Math.sin(p.angle)*p.speed;
      p.life--;

      ctx.fillStyle=`hsl(${Math.random()*360},100%,50%)`;
      ctx.fillRect(p.x,p.y,3,3);

      if(p.life<=0) particles.splice(index,1);
    });

    requestAnimationFrame(animate);
  }

  return { start };
})();

/* ====================================================== */
App.init();
</script>

</body>
</html>
