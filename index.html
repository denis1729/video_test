<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PARA EMA ❤️</title>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  text-align:center;
  overflow-x:hidden;
}

/* INICIO */
.start{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  color:white;
  padding:20px;
}

.start h1{
  font-size:36px;
}

button{
  padding:14px 24px;
  font-size:18px;
  border:none;
  border-radius:10px;
  background:#ff6b81;
  color:white;
  cursor:pointer;
  margin-top:20px;
}

/* ESCENA */
.scene{
  display:none;
  width:100%;
}

/* SOBRE */
.envelope{
  position:relative;
  width:90%;
  max-width:500px;
  height:220px;
  background:white;
  margin:40px auto;
  border-radius:12px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
  overflow:hidden;
  cursor:pointer;
}

.flap{
  position:absolute;
  width:100%;
  height:100%;
  background:#ff6b81;
  clip-path:polygon(0 0,100% 0,50% 55%);
  transition:0.8s;
  z-index:2;
}

.envelope.open .flap{
  transform:translateY(-100%);
}

/* CARTA */
.letter{
  width:90%;
  max-width:500px;
  margin:20px auto 60px auto;
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 10px 25px rgba(0,0,0,0.15);
  transform:translateY(50px);
  opacity:0;
  transition:0.8s;
  font-size:16px;
  line-height:1.5;
}

.letter.show{
  transform:translateY(0);
  opacity:1;
}

/* FOTO */
.photo{
  width:100%;
  border-radius:12px;
  margin-bottom:15px;
}

/* CORAZONES */
.heart{
  position:fixed;
  bottom:-20px;
  animation:float 6s linear infinite;
}

@keyframes float{
  from{ transform:translateY(0); opacity:1;}
  to{ transform:translateY(-110vh); opacity:0;}
}
</style>
</head>

<body>

<!-- INICIO -->
<div class="start" id="start">
  <h1>ABRE LA CARTA MI VIDA ❤️</h1>
  <p>Tengo una sorpresa para ti…</p>
  <button onclick="begin()">Abrir</button>
</div>

<!-- ESCENA -->
<div class="scene" id="scene">

  <div class="envelope" onclick="openLetter(this)">
    <div class="flap"></div>
  </div>

  <div class="letter" id="letter">

    <img src="foto.jpg" class="photo">

    <h2>Feliz 14 de febrero ❤️</h2>

    <p>
      A tu lado entendí lo que significa amar de verdad.
      Gracias por cada abrazo, cada palabra y cada momento
      que construimos juntos.
    </p>

    <p>
      Si volviera a empezar mi vida,
      te elegiría una y mil veces más.
    </p>

    <p><b>Siempre tú y yo.<br>Denis 💖</b></p>

  </div>

</div>

<!-- MUSICA -->
<audio id="music" loop>
  <source src="perfect.mp3" type="audio/mpeg">
</audio>

<script>
function begin(){
  document.getElementById("start").style.display="none";
  document.getElementById("scene").style.display="block";
  document.getElementById("music").play();
}

function openLetter(element){
  element.classList.toggle("open");

  // mostrar carta
  const letter = document.getElementById("letter");
  setTimeout(()=> letter.classList.add("show"), 400);

  // corazones
  for(let i=0;i<40;i++){
    let heart = document.createElement("div");
    heart.className="heart";
    heart.innerHTML="❤️";
    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(Math.random()*20+15)+"px";
    heart.style.animationDuration=(Math.random()*3+3)+"s";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),12000);
  }

  // scroll auto
  setTimeout(()=>{
    window.scrollTo({
      top: document.body.scrollHeight,
      behavior: "smooth"
    });
  }, 800);
}
</script>

</body>
</html>
